spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}
gemini.api.key=${GEMINI_API_KEY}
spring.jpa.hibernate.ddl-auto=update

# Brevo Mail Configuration (Default SMTP relay for Cloud Hosting like Render)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Verified Sender in Brevo (defaults to MAIL_FROM or MAIL_USERNAME)
mail.from.email=${MAIL_FROM:${spring.mail.username}}
mail.from.name=${MAIL_FROM_NAME:SpentAI}
