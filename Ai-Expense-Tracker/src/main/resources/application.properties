# Server Port (Render provides $PORT automatically)
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# CORS & External APIs
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
gemini.api.key=${GEMINI_API_KEY:}

# Brevo Mail Configuration (Default SMTP relay for Cloud Hosting like Render)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Verified Sender in Brevo (defaults to MAIL_FROM or MAIL_USERNAME)
mail.from.email=${MAIL_FROM:${spring.mail.username:}}
mail.from.name=${MAIL_FROM_NAME:SpentAI}

